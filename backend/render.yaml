# Render blueprint for the FloodCast backend.
#
# Deploy: point Render at this repo, set the root directory to `backend/`,
# and supply the `sync: false` secrets in the dashboard. Everything with a
# value here is safe to commit; nothing secret appears in this file.
#
# The service runs fine with NO secrets set at all — Open-Meteo needs no
# key and the chat pipeline falls back to deterministic rules without AWS
# credentials. Both blocks below are upgrades, not prerequisites.
#
# If deploying via Render's native-Python runtime instead of this Docker
# blueprint (e.g. tooling that doesn't support `runtime: docker`), also
# set PYTHON_VERSION to a 3.11.x release. Render's native-Python default
# has, at various points, been newer than any published pydantic-core
# wheel — pip then falls back to compiling it from source via maturin,
# which fails outright in Render's build sandbox (its Cargo cache
# directory is read-only). This Docker path is unaffected: the image
# pins python:3.11-slim itself.

services:
  - type: web
    name: floodcast-gurugram-api
    runtime: docker
    plan: free
    region: singapore # Closest Render region to Gurugram
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health

    # A free-tier service sleeps after ~15 minutes idle and takes 30-60s
    # to wake. Point an external uptime monitor at /health to keep it warm;
    # the endpoint reads cached state only, so polling costs nothing.
    envVars:
      # ── Weather ────────────────────────────────────────────────────
      # Open-Meteo is the default and needs no key. Set the OWM key only
      # to enable it as an alternative provider.
      - key: WEATHER_PROVIDER
        value: open-meteo
      - key: OPENWEATHERMAP_API_KEY
        sync: false

      # ── LLM (optional) ─────────────────────────────────────────────
      # Leave unset to run the deterministic verdict pipeline.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-1
      # Bedrock model IDs are the first-party Claude IDs with an
      # `anthropic.` prefix. Configurable so they can be updated without
      # a code change as new versions ship.
      - key: BEDROCK_HAIKU_MODEL_ID
        value: anthropic.claude-haiku-4-5
      - key: BEDROCK_SONNET_MODEL_ID
        value: anthropic.claude-sonnet-5

      # ── Web ────────────────────────────────────────────────────────
      # Exact origins, never a wildcard. A Vercel project under a team
      # scope (not a personal account) gets a team-suffixed domain
      # rather than the bare <name>.vercel.app — replace with whatever
      # `vercel project ls` or the dashboard actually shows you.
      - key: ALLOWED_ORIGINS
        value: https://floodcast-gurugram-adarshcod30s-projects.vercel.app,https://floodcast-gurugram-git-main-adarshcod30s-projects.vercel.app
      - key: CHAT_RATE_LIMIT
        value: 10/minute
      - key: REPORT_RATE_LIMIT
        value: 5/hour

      # ── Geocoding fallback ─────────────────────────────────────────
      # Nominatim returns 403 without a real contact address.
      - key: NOMINATIM_CONTACT
        sync: false

      # ── Runtime state ──────────────────────────────────────────────
      # Citizen reports are written here. Render's free tier has no
      # persistent disk, so this store resets on each deploy; attach a
      # Render disk (or move the store to Postgres) if reports must
      # survive a redeploy.
      - key: REPORTS_STORE_PATH
        value: var/citizen_reports.json
