name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        # No secrets are configured, which is the point: the suite must
        # pass in the same zero-configuration mode a fresh clone runs in.
        # Anything that genuinely needs a key belongs behind a skip, not
        # in the default run.
        run: python -m pytest tests -q

  frontend:
    name: Frontend — type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    name: Backend — image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Render builds from this Dockerfile, so a broken image should fail
      # here rather than at deploy time.
      - name: Build image
        run: docker build -t floodcast-api ./backend

      - name: Container starts and reports healthy
        run: |
          docker run -d --name api -p 8000:10000 floodcast-api
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "Health check passed"
              curl -s http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "Service did not become healthy in time"
          docker logs api
          exit 1
