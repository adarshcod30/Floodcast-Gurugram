name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App - lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # No keys, no network, no services. The suite must pass in exactly
        # the zero-configuration state a fresh clone runs in, because that
        # is also the state the deployed site runs in.
        run: npm test

      - name: Type-check and build
        run: npm run build

  data:
    name: Data - register reproduces from source
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Regenerate the register from the generators
        # The committed register is the output of these four stages. If the
        # two ever disagree, the JSON the app ships is no longer traceable
        # to the sourcing recorded in DATA_PROVENANCE.md, which is the one
        # claim this project cannot afford to get wrong.
        run: |
          python3 data/generate_hotspots.py
          python3 data/generate_expansion.py
          python3 data/generate_2026_monsoon_update.py
          python3 data/export_to_frontend.py

      - name: Committed data matches the generators
        run: |
          if ! git diff --quiet -- data frontend/src/data; then
            echo "Regenerated data differs from what is committed:"
            git diff --stat -- data frontend/src/data
            git diff -- frontend/src/data | head -100
            exit 1
          fi
          echo "Register reproduces exactly."
